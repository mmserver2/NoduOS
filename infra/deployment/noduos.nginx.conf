limit_req_zone $binary_remote_addr zone=noduos_api:10m rate=30r/s;

server {
  listen 8080;
  listen [::]:8080;
  server_name _;
  return 308 https://$host:8443$request_uri;
}

server {
  listen 8443 ssl;
  listen [::]:8443 ssl;
  server_name _;

  ssl_certificate /etc/noduos/tls/noduos-local.crt;
  ssl_certificate_key /etc/noduos/tls/noduos-local.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_timeout 1d;
  ssl_session_cache shared:NODUOS_TLS:10m;
  ssl_session_tickets off;

  add_header Strict-Transport-Security "max-age=86400" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

  root /opt/noduos/current/apps/web/dist;
  index index.html;
  client_max_body_size 64k;

  location = /api/health {
    limit_req zone=noduos_api burst=20 nodelay;
    proxy_pass http://127.0.0.1:4100/health;
    include proxy_params;
    proxy_http_version 1.1;
  }

  location /api/ {
    limit_req zone=noduos_api burst=60 nodelay;
    proxy_pass http://127.0.0.1:4100/;
    include proxy_params;
    proxy_http_version 1.1;
    proxy_connect_timeout 3s;
    proxy_read_timeout 20s;
    proxy_send_timeout 20s;
  }

  location ~* \.(?:js|css|png|svg|ico|woff2)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-store";
  }

  location = /metrics { return 404; }
  location ~ /\. { deny all; }
}
